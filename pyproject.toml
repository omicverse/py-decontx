[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydecontx"
version = "0.1.0"
description = "Pure-Python port of the Bioconductor decontX package — decontamination of ambient RNA in single-cell RNA-seq via a Bayesian two-component multinomial mixture."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "decontX", "DecontX", "ambient-RNA", "decontamination", "single-cell",
    "scRNA-seq", "contamination", "variational-EM", "anndata",
    "bioinformatics", "celda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "anndata>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/omicverse/py-decontx"
Repository = "https://github.com/omicverse/py-decontx"
Issues = "https://github.com/omicverse/py-decontx/issues"
"Upstream Bioc package" = "https://bioconductor.org/packages/release/bioc/html/decontX.html"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["pydecontx*"]
exclude = ["tests*", "examples*", "decontX-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
